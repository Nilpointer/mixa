[package]
name = "mixa"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "A modern mixer for the Linux sound system ALSA"

[dependencies]
alsa-sys = "0.6.1"
eframe = { version = "0.36.2", features = ["persistence"] }
libc = "0.2.190"
serde = { version = "1.0.229", features = ["derive"] }

[profile.release]
lto = "thin"
strip = true
